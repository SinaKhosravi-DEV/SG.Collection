<!doctype html>
<html lang="fa" dir="rtl"></html>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="public/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SG Collection</title>
    <link href="/src/style.css" rel="stylesheet"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body class="pb-30">
    <header class="flex justify-between items-center pl-2 pr-4 py-2 sticky top-0 z-50 bg-white/80 backdrop-blur-2xl border-b border-[#D9539E]/30">
      <div class="flex items-center gap-1.5">
        <p class="size-1.5 bg-[#ee74b5] rounded-full"></p>
        <p class="text-[11px] font-medium text-[#e0539e]">طراحی با ظرافت</p>
      </div>
      <div class="flex items-center">
        <p class="font-bold">SG Collection</p>
        <img src="public/logo.png" alt="logo" class="w-12" />
      </div>
    </header>

    <main>
      <section class="view grid place-items-center text-center relative overflow-hidden pb-20 pt-15">
        <p class="text-[#E0539E] bg-[#FDE9F4] w-fit text-[12px] font-semibold px-4 py-1.5 rounded-full">کالکشن تابستان ۱۴۰۴</p>
        <p class="font-bold text-[32px] my-5">زیبایی که می پوشی</p>
        <p class="text-[#6E4A5F] px-9 tracking-tighter leading-8 text-[15px] font-medium">پارچه های منتخب, طراحی های مینیمال و دوختی که کیفیت را در هر جزئیات به نمایش می گذارد</p>
        <a href="#prodcuts" class="bg-white text-[#f592c8] px-7 py-4 mt-12 rounded-full font-bold transition-all duration-0 shadow-[0_18px_34px_-14px_rgba(217,83,158,0.35)]">مشاهده کالکشن</a>
        <div class="absolute inset-x-0 -bottom-px z-[3] h-[34px] w-full
              bg-[radial-gradient(circle_at_17px_0px,transparent_17px,white_17.5px)]
              bg-[length:34px_34px] bg-repeat-x">
        </div>
      </section>
      <section class="mt-45 px-4 scroll-mt-24" id="prodcuts">
        <p class="text-[#E0539E] bg-[#FDE9F4] mx-auto w-fit text-[13px] font-semibold px-4 py-1.5 rounded-full">پرفروش های فصل</p>
        <p class="font-bold text-[28px] mt-4 text-center">محصولات ویژه</p>
      </section>
      <section class="grid grid-cols-2 mt-10 px-4 gap-3">
        <div class="group border rounded-2xl overflow-hidden border-[#D9539E]/30 transition-transform duration-300 hover:-translate-y-1.5 shadow-[0_18px_34px_-14px_rgba(217,83,158,0.35)]">
          <div class="aspect-[3/4] overflow-hidden rounded-2xl relative after:content-[''] after:absolute after:inset-x-0 after:bottom-0 after:h-4
                  after:bg-[radial-gradient(circle_at_8px_16px,white_8px,transparent_8.5px)]
                  after:bg-[length:16px_16px] after:bg-repeat-x">
            <img src="public/p1/1.1.jpg" alt="p2.1" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-[1.06]">
          </div>
          <div class="px-3 pt-3 pb-6 grid gap-7">
            <p class="font-bold text-[15px]">شومیز سلین</p>
            <button class="bg-[#FFF3FA] text-[#D9539E] font-medium py-1.5 rounded-lg border border-[#D9539E]/30 text-[13px]">مشخصات</button>
          </div>
        </div>

        <div class="group border overflow-hidden rounded-2xl border-[#D9539E]/30 transition-transform duration-300 hover:-translate-y-1.5 shadow-[0_18px_34px_-14px_rgba(217,83,158,0.35)]">
          <div class="aspect-[3/4] relative overflow-hidden rounded-2xl after:content-[''] after:absolute after:inset-x-0 after:bottom-0 after:h-4
                  after:bg-[radial-gradient(circle_at_8px_16px,white_8px,transparent_8.5px)]
                  after:bg-[length:16px_16px] after:bg-repeat-x">
            <img src="public/p2/2.1.jpg" alt="p2.1" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-[1.06]">
          </div>
          <div class="px-3 pt-3 pb-6 grid gap-7">
            <p class="font-bold text-[15px]">تیشرت STAR</p>
            <button class="bg-[#FFF3FA] text-[#D9539E] font-medium py-1.5 rounded-lg border-[#D9539E]/30 border text-[13px]">مشخصات</button>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
